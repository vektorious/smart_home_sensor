<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">BME680 to ESP32-C6 six-pin connector</title>
  <desc id="desc">Component-side view with USB at the top. The microcontroller connector runs from 5V, GND, 3V3, GPIO1, GPIO2 to GPIO3. Connect 3V3 to VCC, GND to GND, GPIO2 to SCL and GPIO3 to SDA. Leave 5V, GPIO1, SDO and CS unused. A wire bridge indicates no connection.</desc>
  <rect width="760" height="260" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#17212b">
    <text x="18" y="23" font-size="18" font-weight="bold">Microcontroller · 1 × 6</text>
    <text x="18" y="43" font-size="13">Component side; USB end ↑</text>
    <rect x="22" y="60" width="48" height="180" rx="5" fill="#e9edf0" stroke="#17212b" stroke-width="2"/>
    <g fill="white" stroke="#17212b" stroke-width="2">
      <rect x="37" y="66" width="18" height="18"/><rect x="37" y="96" width="18" height="18"/>
      <rect x="37" y="126" width="18" height="18"/><rect x="37" y="156" width="18" height="18"/>
      <rect x="37" y="186" width="18" height="18"/><rect x="37" y="216" width="18" height="18"/>
    </g>
    <g font-size="16">
      <text x="82" y="81">5V (unused)</text><text x="82" y="111">GND</text>
      <text x="82" y="141">3V3</text><text x="82" y="171">GPIO1 (unused)</text>
      <text x="82" y="201">GPIO2</text><text x="82" y="231">GPIO3</text>
    </g>
    <path d="M550 44 H675 L696 65 V106 Q696 115 705 115 H744 V166 H705 Q696 166 696 175 V215 L675 236 H550 V44 Z" fill="#f3eff8" stroke="#443655" stroke-width="2"/>
    <text x="580" y="24" font-size="18" font-weight="bold">BME680</text>
    <g fill="white" stroke="#443655" stroke-width="2">
      <circle cx="567" cy="65" r="7"/><circle cx="567" cy="95" r="7"/>
      <circle cx="567" cy="125" r="7"/><circle cx="567" cy="155" r="7"/>
      <circle cx="567" cy="185" r="7"/><circle cx="567" cy="215" r="7"/>
      <circle cx="674" cy="72" r="12"/><circle cx="674" cy="209" r="12"/>
    </g>
    <g font-size="16">
      <text x="581" y="71">VCC</text><text x="581" y="101">GND</text>
      <text x="581" y="131">SCL</text><text x="581" y="161">SDA</text>
      <text x="581" y="191">SDO</text><text x="581" y="221">CS</text>
    </g>
    <rect x="706" y="124" width="29" height="33" rx="3" fill="#ddd" stroke="#666" stroke-width="2"/>
    <circle cx="713" cy="131" r="2" fill="#555"/>
    <text x="575" y="253" font-size="12">SDO / CS unused</text>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
      <path d="M55 105 H76 M132 105 H475 V95 H560" stroke="white" stroke-width="9"/>
      <path d="M55 105 H76 M132 105 H475 V95 H560" stroke="#333"/>
      <!-- White underlay and curved bridge: power crosses ground without joining. -->
      <path d="M55 135 H76 M132 135 H265 V114 Q280 105 265 96 V65 H560" stroke="white" stroke-width="9"/>
      <path d="M55 135 H76 M132 135 H265 V114 Q280 105 265 96 V65 H560" stroke="#b33232"/>
      <path d="M55 195 H76 M148 195 H380 V125 H560" stroke="white" stroke-width="9"/>
      <path d="M55 195 H76 M148 195 H380 V125 H560" stroke="#a66800"/>
      <path d="M55 225 H76 M148 225 H435 V155 H560" stroke="white" stroke-width="9"/>
      <path d="M55 225 H76 M148 225 H435 V155 H560" stroke="#176d88"/>
    </g>
    <text x="303" y="57" font-size="13" fill="#a22626">3.3 V only</text>
    <text x="282" y="250" font-size="12">Follow pin labels, not wire colours.</text>
  </g>
</svg>
